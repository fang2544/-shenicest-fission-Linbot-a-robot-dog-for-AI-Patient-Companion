hospital_mapping_planner:
  ros__parameters:
    # 真机部署时替换为机器人实际使用的话题和坐标系名称。
    cloud_topic: /points
    global_frame: map
    base_frame: base_link

    # 室内建图默认使用 10 厘米体素，可按传感器精度调整。
    voxel_resolution: 0.10
    floor_z: 0.0
    sensor_max_range: 8.0
    max_rays_per_cloud: 12000

    # 此高度范围内的点视为机身障碍物，地面和天花板不参与避障。
    min_obstacle_height: 0.15
    max_obstacle_height: 1.80

    # 根据机器人实测轮廓和定位误差调整障碍膨胀半径。
    inflation_radius: 0.55
    map_padding: 1.0
    allow_unknown_planning: false

    publish_period_sec: 1.0
    map_file: /vbot_ws/maps/hospital_F1.voxels.json.gz
    load_map_on_start: false
