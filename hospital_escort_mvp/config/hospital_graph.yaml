hospital: vbot_demo_hospital

cost_model:
  unit: seconds
  reference_walk_speed_mps: 0.60
  description: 所有边统一按预计耗时计权；等效距离=预计耗时×参考步行速度

floors:
  B1:
    map_name: hospital_B1
    nodes:
      parking:
        {name: 地库接诊点, type: poi, x: 3.2, y: 6.5, yaw: 0.0}
      elevator_A_B1:
        {name: A电梯B1口, type: elevator, elevator_id: A, x: 16.7, y: 8.1, yaw: 1.57}

  F1:
    map_name: hospital_F1
    nodes:
      lobby:
        {name: 门诊大厅, type: poi, x: 2.0, y: 2.0, yaw: 0.0}
      registration:
        {name: 挂号窗口, type: poi, x: 6.2, y: 5.4, yaw: 1.57}
      pharmacy:
        {name: 药房, type: poi, x: 21.7, y: 9.8, yaw: 3.14}
      elevator_A_F1:
        {name: A电梯F1口, type: elevator, elevator_id: A, x: 13.2, y: 7.8, yaw: 1.57}
      restroom_F1:
        {name: 一楼无障碍卫生间, type: restroom, x: 9.2, y: 3.0, yaw: -1.57}

  F2:
    map_name: hospital_F2
    nodes:
      imaging:
        {name: 影像科, type: poi, x: 20.0, y: 9.0, yaw: 0.0}
      laboratory:
        {name: 检验科, type: poi, x: 14.0, y: 3.0, yaw: -1.57}
      elevator_A_F2:
        {name: A电梯F2口, type: elevator, elevator_id: A, x: 7.9, y: 13.5, yaw: 1.57}

  F3:
    map_name: hospital_F3
    nodes:
      cardiology:
        {name: 心内科, type: poi, x: 24.6, y: 11.4, yaw: 0.0}
      ward:
        {name: 住院病区, type: poi, x: 5.0, y: 10.0, yaw: 3.14}
      elevator_A_F3:
        {name: A电梯F3口, type: elevator, elevator_id: A, x: 12.8, y: 7.7, yaw: 1.57}

edges:
  # 同楼层边：测量距离用于审计，规划权重使用实际预计时间。
  - {id: B1_parking_A, from: parking, to: elevator_A_B1, type: walk, distance_m: 16.0, travel_time_sec: 29, bidirectional: true}
  - {id: F1_lobby_registration, from: lobby, to: registration, type: walk, distance_m: 5.5, travel_time_sec: 11, bidirectional: true}
  - {id: F1_registration_A, from: registration, to: elevator_A_F1, type: walk, distance_m: 7.5, travel_time_sec: 15, bidirectional: true}
  - {id: F1_A_pharmacy, from: elevator_A_F1, to: pharmacy, type: walk, distance_m: 9.0, travel_time_sec: 18, bidirectional: true}
  - {id: F1_registration_restroom, from: registration, to: restroom_F1, type: walk, distance_m: 4.0, travel_time_sec: 8, bidirectional: true}
  - {id: F1_restroom_A, from: restroom_F1, to: elevator_A_F1, type: walk, distance_m: 5.0, travel_time_sec: 10, bidirectional: true}
  - {id: F2_A_imaging, from: elevator_A_F2, to: imaging, type: walk, distance_m: 13.0, travel_time_sec: 25, bidirectional: true}
  - {id: F2_A_laboratory, from: elevator_A_F2, to: laboratory, type: walk, distance_m: 12.0, travel_time_sec: 24, bidirectional: true}
  - {id: F3_A_cardiology, from: elevator_A_F3, to: cardiology, type: walk, distance_m: 13.0, travel_time_sec: 24, bidirectional: true}
  - {id: F3_A_ward, from: elevator_A_F3, to: ward, type: walk, distance_m: 8.5, travel_time_sec: 17, bidirectional: true}

  # 电梯边：包含等待、开关门、进出轿厢和运行时间，故等效距离显著增大。
  - {id: elevator_A_B1_F1, from: elevator_A_B1, to: elevator_A_F1, type: elevator, elevator_id: A, travel_time_sec: 52, bidirectional: true}
  - {id: elevator_A_B1_F2, from: elevator_A_B1, to: elevator_A_F2, type: elevator, elevator_id: A, travel_time_sec: 61, bidirectional: true}
  - {id: elevator_A_B1_F3, from: elevator_A_B1, to: elevator_A_F3, type: elevator, elevator_id: A, travel_time_sec: 70, bidirectional: true}
  - {id: elevator_A_F1_F2, from: elevator_A_F1, to: elevator_A_F2, type: elevator, elevator_id: A, travel_time_sec: 50, bidirectional: true}
  - {id: elevator_A_F1_F3, from: elevator_A_F1, to: elevator_A_F3, type: elevator, elevator_id: A, travel_time_sec: 58, bidirectional: true}
  - {id: elevator_A_F2_F3, from: elevator_A_F2, to: elevator_A_F3, type: elevator, elevator_id: A, travel_time_sec: 50, bidirectional: true}
