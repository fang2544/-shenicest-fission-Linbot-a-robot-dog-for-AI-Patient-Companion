  - {id: F1_lobby_pharmacy, from: lobby_1f, to: pharmacy_1f, type: walk, distance_m: 1.4, travel_time_sec: 6, bidirectional: true}
  - {id: F1_lobby_restroom, from: lobby_1f, to: restroom_1f, type: walk, distance_m: 1.1, travel_time_sec: 5, bidirectional: true}
  - {id: F2_lift_corridor, from: elevator_A_F2, to: corridor_F2, type: walk, distance_m: 1.1, travel_time_sec: 5, bidirectional: true}
  - {id: F2_corridor_ecg, from: corridor_F2, to: ecg_2f, type: walk, distance_m: 1.3, travel_time_sec: 6, bidirectional: true}
  - {id: F2_corridor_echo_wait, from: corridor_F2, to: echo_waiting_2f, type: walk, distance_m: 1.3, travel_time_sec: 6, bidirectional: true}
  - {id: F2_ecg_imaging, from: ecg_2f, to: imaging_2f, type: walk, distance_m: 0.9, travel_time_sec: 4, bidirectional: true}
