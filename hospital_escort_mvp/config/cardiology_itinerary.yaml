minimum_confidence: 0.65
start_node: cardiology_3f
start_phrases: [开始陪诊, 开始检查, 带我去做检查, 我准备好了]

# 医院系统可向 /hospital/queue_status 发布等待秒数或排队统计 JSON；
# 接口不可用时使用下面的保守估算值。
queue_planning:
  enabled: true
  topic: /hospital/queue_status
  stale_after_sec: 120
  ewma_alpha: 0.35
  fallback_wait_times_sec:
    blood_draw_1f: {queue_length: 8, avg_service_time_sec: 90, active_counters: 2}
    ecg_2f: {queue_length: 2, avg_service_time_sec: 240, active_counters: 1}
    cardiac_ultrasound_2f: {estimated_wait_sec: 1800}

prompts:
  ready: 您好，我是陪诊机器狗聆灵。医生已经为您安排好检查，聆灵会结合路程和排队时间规划顺序，最后返回三楼心内科。准备好后请说开始陪诊。
  accepted: 好的，聆灵正在结合路程与排队时间安排未完成检查。请走在我侧后方，并注意身边行人。
  low_confidence: 抱歉，我没有听清。准备出发请说开始陪诊。
  busy: 当前陪诊任务正在进行。我会在每个检查点提醒您下一步。
  failed: 导航没有成功，我已经停止移动，请工作人员协助。
  completed: 三项检查已经完成，我们回到三楼心内科了。检查单记得交给医生，我的陪诊任务完成。

status_queries:
  phrases: [到哪一步了, 现在到哪了, 下一项是什么, 还要多久]

wait:
  clinical_duration_sec: 1800
  demo_duration_sec: 30
  start_prompt: 已进入心脏彩超候诊流程，聆灵会根据当前预计等待时间陪您等候并及时提醒。
  jokes:
    - 等待也是检查流程的一部分。咱们先把着急寄存在这里，取号时再一起拿回来。
    - 心电图记录心跳，我们现在练习耐心，两样都很有节奏。
  finished_prompt: 预计等待时间到了，准备前往心脏彩超室，请跟随聆灵。

itinerary:
  - target: blood_draw_1f
    optimization_group: blood_draw
    wait_node: blood_draw_1f
    label: 一楼抽血窗口
    depart_prompt: 根据当前最优顺序，正在前往一楼抽血窗口。
    arrival_prompt: 已到达一楼抽血窗口。完成后，聆灵会重新规划剩余检查。
  - target: ecg_2f
    optimization_group: ecg
    wait_node: ecg_2f
    label: 二楼心电图室
    depart_prompt: 根据当前最优顺序，正在前往二楼心电图室。
    arrival_prompt: 已到达二楼心电图室。完成后，聆灵会重新规划剩余检查。
  - target: echo_waiting_2f
    optimization_group: cardiac_ultrasound
    wait_node: cardiac_ultrasound_2f
    label: 二楼彩超候诊区
    depart_prompt: 根据当前最优顺序，正在前往二楼彩超候诊区。
    arrival_prompt: 已到达彩超候诊区。
    wait_after_arrival: true
  - target: cardiac_ultrasound_2f
    optimization_group: cardiac_ultrasound
    wait_node: cardiac_ultrasound_2f
    label: 二楼心脏彩超室
    depart_prompt: 轮到心脏彩超了，聆灵现在带您前往检查室。
    arrival_prompt: 已到达二楼心脏彩超室。完成检查后，我带您返回三楼心内科。
  - target: cardiology_3f
    label: 三楼心内科
    depart_prompt: 三项检查已完成，最后返回三楼心内科复诊。
    arrival_prompt: 已返回三楼心内科。
