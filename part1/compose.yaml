services:
  vbot_ros2:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    working_dir: /vbot_ws
    volumes:
      - ./vbot_ws:/vbot_ws
      - ./scripts:/workspace/scripts:ro
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "0"
    stdin_open: true
    tty: true

  vbot_sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    platform: linux/amd64
    working_dir: /vbot_ws
    volumes:
      - ./vbot_ws:/vbot_ws
      - ./scripts:/workspace/scripts:ro
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "42"
      DISPLAY: ${DISPLAY:-host.docker.internal:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    ports:
      - "6080:6080"
      - "6081:8080"
    stdin_open: true
    tty: true
